name: Feature request
description: Suggest a new check, option, or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A good feature request explains the problem
        first, then the change. Note that Subdomain Takeover Checker stays
        dependency-free (Python standard library only).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what check is missing?
      placeholder: |
        I want the analyzer to flag logins from IP addresses that appear on a
        blocklist I supply, because...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How should it work? Include an example command and expected output if you can.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: What area does this touch?
      options:
        - New service fingerprint
        - CLI option or output format
        - Grading or scoring
        - Documentation
        - Tests or CI
        - Something else
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Any other way to solve the same problem?
    validations:
      required: false
